name: test

on:
  push:
  pull_request:
  # An upstream rename breaks a link here with no commit of ours to trigger on,
  # so the URL job also runs on its own once a week.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.23.4", "24.22.1", "26.12.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Link checker only — zero npm deps, no network: it decodes every
      # "Try it" #a= link in README.md, checks the app payload shape, and
      # checks that every relative link in both files exists on disk.
      - run: npm test

  urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      # The network half: fetches every http URL in README.md and
      # CONTRIBUTING.md and fails on a non-200, naming the dead URL. This is
      # what catches an awesome-noodles rename turning a graph link into a 404.
      # It repeats the offline relative-link check too, so one command covers
      # every link on both pages.
      - run: node scripts/check-urls.mjs
